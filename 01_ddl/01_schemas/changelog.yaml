databaseChangeLog:
  - changeSet:
      id: 001_create_schema_iam
      author: Thiago
      comment: Creates the iam schema that holds every table owned by the iam service.
      changes:
        - sqlFile:
            path: 001_create_schema_iam.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/01_schemas/001_create_schema_iam.rollback.sql
            relativeToChangelogFile: true
            stripComments: false

  - changeSet:
      id: 002_create_schema_shared
      author: thiagxrg
      comment: Creates the shared schema for cross-cutting tables (audit).
      changes:
        - sqlFile:
            path: 002_create_schema_shared.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/01_schemas/002_create_schema_shared.rollback.sql
            relativeToChangelogFile: true
            stripComments: false
