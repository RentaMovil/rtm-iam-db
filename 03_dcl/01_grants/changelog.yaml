            path: 002_grant_insert_audit_to_iam_app.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/03_dcl/01_grants/002_grant_insert_audit_to_iam_app.rollback.sql
            relativeToChangelogFile: true
            stripComments: false
